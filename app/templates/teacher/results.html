{% extends "base.html" %}

{% block title %}Exam Results - {{ exam.exam_title }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>{{ exam.exam_title }} - Results</h2>
    <div>
        <button onclick="deleteExam({{ exam.id }})" class="btn btn-danger">
            <i class="bi bi-trash"></i> Delete Exam
        </button>
        <a href="{{ url_for('teacher.manage_exam', exam_id=exam.id) }}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Back to Exam
        </a>
    </div>
</div>

<!-- Rest of your results content... -->

<script>
function deleteExam(examId) {
    if (confirm('⚠️ Are you sure you want to delete this exam?\n\nThis will permanently delete all results, attempts, and the exam itself!\n\nThis action CANNOT be undone!')) {
        fetch(`/teacher/exam/${examId}/delete`, {
            method: 'POST',
            headers: {
                'X-CSRFToken': '{{ csrf_token() if csrf_token else "" }}',
                'Content-Type': 'application/json'
            }
        }).then(response => {
            if (response.redirected) {
                window.location.href = response.url;
            }
        }).catch(error => {
            alert('Error deleting exam: ' + error);
        });
    }
}
</script>
{% endblock %}
