{% extends "base.html" %}

{% block title %}Register - CBT Platform{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow">
            <div class="card-body">
                <h2 class="text-center text-success mb-4">
                    <i class="bi bi-person-plus"></i> Register
                </h2>
                
                <form method="POST" action="{{ url_for('auth.register') }}">
                    {{ form.hidden_tag() if form }}
                    
                    <div class="mb-3">
                        <label for="full_name" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="full_name" name="full_name" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required minlength="8">
                        <div class="form-text">Password must be at least 8 characters long.</div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="role" class="form-label">Register as</label>
                        <select class="form-select" id="role" name="role">
                            <option value="student">Student</option>
                            <option value="teacher">Teacher</option>
                        </select>
                    </div>
                    
                    <!-- Student specific fields -->
                    <div id="student-fields" class="student-fields">
                        <div class="mb-3">
                            <label for="admission_number" class="form-label">Admission Number</label>
                            <input type="text" class="form-control" id="admission_number" name="admission_number">
                        </div>
                        <div class="mb-3">
                            <label for="class_level" class="form-label">Class Level</label>
                            <input type="text" class="form-control" id="class_level" name="class_level">
                        </div>
                    </div>
                    
                    <!-- Teacher specific fields -->
                    <div id="teacher-fields" class="teacher-fields" style="display:none;">
                        <div class="mb-3">
                            <label for="staff_id" class="form-label">Staff ID</label>
                            <input type="text" class="form-control" id="staff_id" name="staff_id">
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-success w-100">Register</button>
                </form>
                
                <hr>
                <div class="text-center">
                    <p class="mb-0">Already have an account? <a href="{{ url_for('auth.login') }}">Login</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('role').addEventListener('change', function() {
    if (this.value === 'student') {
        document.getElementById('student-fields').style.display = 'block';
        document.getElementById('teacher-fields').style.display = 'none';
    } else {
        document.getElementById('student-fields').style.display = 'none';
        document.getElementById('teacher-fields').style.display = 'block';
    }
});
</script>
{% endblock %}
